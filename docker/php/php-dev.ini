; Dev-only overrides
display_errors = On
error_reporting = E_ALL
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Default off for speed; override per-run with `docker compose run -e XDEBUG_MODE=debug app ...`
; (Xdebug 3 reads the XDEBUG_MODE env var at runtime and overrides this.)
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
