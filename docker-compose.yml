services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      PHP_IDE_CONFIG: "serverName=icmi"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: icmi
      DB_USERNAME: icmi
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on: [db, redis]
    # vendor/ dipakai bersama dengan servis queue (volume "vendor" sama) — healthcheck menandai
    # kapan composer install di entrypoint sudah selesai, supaya queue tidak install serentak
    # dan balapan menulis ke volume yang sama.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/vendor/autoload.php"]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: icmi
      MARIADB_USER: icmi
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret
    ports: ["3306:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: php artisan queue:listen --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: icmi
      DB_USERNAME: icmi
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  phpmyadmin:
    image: phpmyadmin:5
    ports: ["8080:80"]
    environment:
      PMA_HOST: db
      PMA_USER: icmi
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports: ["5173:5173"]

volumes:
  dbdata:
  redisdata:
  vendor:
  node_modules:
